<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Mapa interactivo Burgos PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:Arial; }

#map {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:1;
}

#panel {
  position:absolute;
  top:10px;
  right:10px;
  width:250px;
  background:white;
  padding:10px;
  border-radius:10px;
  z-index:1000;
}

#menu {
  position:absolute;
  top:10px;
  left:10px;
  z-index:1000;
}

#menu button {
  display:block;
  margin-bottom:5px;
  padding:8px;
  background:#0078D7;
  color:white;
  border:none;
}
</style>
</head>

<body>

<div id="menu">
<button onclick="map.setView([20,0],2)">🌍 Mundo</button>
<button onclick="map.setView([50,10],4)">🇪🇺 UE</button>
<button onclick="map.setView([40,-3],6)">🇪🇸 España</button>
<button onclick="map.fitBounds(capaCyL.getBounds())">Castilla y León</button>
<button onclick="map.fitBounds(capaBurgos.getBounds())">Burgos</button>
</div>

<div id="panel">
<h3>Selecciona un lugar</h3>
<textarea>Escribe aquí tu información...</textarea>
</div>

<div id="map"></div>

<script>

var map = L.map('map').setView([20,0],2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

let capaCyL;
let capaBurgos;

// Castilla y León (verde)
fetch('https://raw.githubusercontent.com/codeforgermany/click_that_hood/main/public/data/spain-regions.geojson')
.then(res => res.json())
.then(data => {

  var cyl = data.features.filter(f =>
    f.properties.name === "Castilla y León"
  );

  capaCyL = L.geoJSON(cyl, {
    style: {
      color: '#006400',
      weight: 4,
      fillColor: '#00ff00',
      fillOpacity: 0.3
    }
  }).addTo(map);

});

// Burgos (rojo)
fetch('https://raw.githubusercontent.com/codeforgermany/click_that_hood/main/public/data/spain-provinces.geojson')
.then(res => res.json())
.then(data => {

  var burgos = data.features.filter(f => f.properties.name === "Burgos");

  capaBurgos = L.geoJSON(burgos, {
    style: {
      color: 'red',
      weight: 3,
      fillColor: '#ff0000',
      fillOpacity: 0.2
    }
  }).addTo(map);

  map.fitBounds(capaBurgos.getBounds());
});

</script>

</body>
</html>
