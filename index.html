<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Mapa interactivo Burgos PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:Arial; }

#map {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:1;
}

#panel {
  position:absolute;
  top:10px;
  right:10px;
  width:250px;
  background:white;
  padding:10px;
  border-radius:10px;
  z-index:1000;
}

#menu {
  position:absolute;
  top:10px;
  left:10px;
  z-index:1000;
}

#menu button {
  display:block;
  margin-bottom:5px;
  padding:8px;
  background:#0078D7;
  color:white;
  border:none;
  cursor:pointer;
}

textarea { width:100%; height:100px; }
</style>
</head>

<body>

<div id="menu">
<button onclick="map.setView([20,0],2)">🌍 Mundo</button>
<button onclick="map.setView([50,10],4)">🇪🇺 UE</button>
<button onclick="map.setView([40,-3],6)">🇪🇸 España</button>
<button onclick="mostrarCastillaYLeon()">Castilla y León</button>
<button onclick="mostrarBurgos()">Burgos</button>
</div>

<div id="panel">
<h3 id="titulo">Selecciona un lugar</h3>
<textarea>Escribe aquí tu información...</textarea>
</div>

<div id="map"></div>

<script>
var map = L.map('map').setView([42.34,-3.69],8);
var cylLayer = null;
var burgosLayer = null;

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

// Función para crear marcadores
function crear(nombre, lat, lon, imagen = null) {
  let imgFinal = imagen ? imagen : "blanco.jpg";
  let contenido = `<b>${nombre}</b><br>`;
  contenido += `<img src="./${imgFinal}" width="200">`;
  L.marker([lat, lon]).addTo(map).bindPopup(contenido);
}

// Función para mostrar Castilla y León
function mostrarCastillaYLeon() {
  if(cylLayer) {
    map.fitBounds(cylLayer.getBounds());
  }
}

// Función para mostrar Burgos
function mostrarBurgos() {
  if(burgosLayer) {
    map.fitBounds(burgosLayer.getBounds());
  }
}

// Cargar datos de regiones españolas
Promise.all([
  // Datos de regiones españolas (geoBoundaries)
  fetch('https://www.geoboundaries.org/data/geoBoundaries-3_0_1/ADM1/simplificationLevel_2/ESP/geoBoundaries-3_0_1-ESP-ADM1-all-bbsimplified.geojson')
    .then(res => res.json())
    .catch(() => null),
  // Alternativa: datos de provincias españolas
  fetch('https://raw.githubusercontent.com/simp37/GeoJson_SPAIN/master/Spain/spain-provinces.geojson')
    .then(res => res.json())
    .catch(() => null)
]).then(([regionesData, provinciasData]) => {
  
  // Cargar Castilla y León desde regiones
  if(regionesData && regionesData.features) {
    var cylData = regionesData.features.find(f => {
      let name = f.properties.shapeName || f.properties.name || "";
      return name.includes("Castilla") || name.includes("León");
    });
    
    if(cylData) {
      cylLayer = L.geoJSON(cylData, {
        style: {
          color: 'green',
          weight: 2,
          fillColor: '#90EE90',
          fillOpacity: 0.4,
          dashArray: '5, 5'
        }
      }).addTo(map);
      console.log('Castilla y León cargada correctamente');
    }
  }
  
  // Cargar Burgos desde provincias
  if(provinciasData && provinciasData.features) {
    var burgosData = provinciasData.features.find(f => {
      let name = f.properties.name || f.properties.NAMEUNIT || "";
      return name === "Burgos";
    });
    
    if(burgosData) {
      burgosLayer = L.geoJSON(burgosData, {
        style: {
          color: 'red',
          weight: 3,
          fillColor: '#FFB6C6',
          fillOpacity: 0.35
        }
      }).addTo(map);
      map.fitBounds(burgosLayer.getBounds());
      console.log('Burgos cargada correctamente');
    }
  }
  
}).then(() => {
  // PUEBLOS
  crear("Cogollos",42.286,-3.581,"cogollos.jpg");
  crear("Isar",42.366,-3.925);
  crear("Cardeñadijo",42.302,-3.639,"cardeñadijo.jpg");
  crear("Las Quintanillas",42.372,-3.823,"lasquintanillas.jpg");
  crear("Orbaneja Riopico",42.401,-3.583,"orbaneja.jpg");
  crear("Rubena",42.390,-3.570,"rubena.jpg");
  crear("Saldaña de Burgos",42.260,-3.699,"saldana.jpg");
  crear("Arcos",42.250,-3.760,"arcos.jpg");
  crear("Buniel",42.310,-3.835);
  crear("Albillos",42.285,-3.790);
  crear("Palacios de Benaver",42.392,-3.895,"palaciosbenaver.jpg");
  crear("Villanueva de las Carretas",42.329,-3.799);
}).catch(err => {
  console.error('Error cargando datos GeoJSON:', err);
  
  // Crear pueblos en fallback
  crear("Cogollos",42.286,-3.581,"cogollos.jpg");
  crear("Isar",42.366,-3.925);
  crear("Cardeñadijo",42.302,-3.639,"cardeñadijo.jpg");
  crear("Las Quintanillas",42.372,-3.823,"lasquintanillas.jpg");
  crear("Orbaneja Riopico",42.401,-3.583,"orbaneja.jpg");
  crear("Rubena",42.390,-3.570,"rubena.jpg");
  crear("Saldaña de Burgos",42.260,-3.699,"saldana.jpg");
  crear("Arcos",42.250,-3.760,"arcos.jpg");
  crear("Buniel",42.310,-3.835);
  crear("Albillos",42.285,-3.790);
  crear("Palacios de Benaver",42.392,-3.895,"palaciosbenaver.jpg");
  crear("Villanueva de las Carretas",42.329,-3.799);
});

</script>

</body>
</html>
