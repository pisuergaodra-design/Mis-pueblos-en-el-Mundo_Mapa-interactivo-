<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Mapa interactivo Burgos PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:Arial; }

#map {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:1;
}
``


#panel {
  position:absolute;
  top:10px;
  right:10px;
  width:250px;
  background:white;
  padding:10px;
  border-radius:10px;
  z-index:1000;
}

#menu {
  position:absolute;
  top:10px;
  left:10px;
  z-index:1000;
}

#menu button {
  display:block;
  margin-bottom:5px;
  padding:8px;
  background:#0078D7;
  color:white;
  border:none;
}

textarea { width:100%; height:100px; }
</style>
</head>

<body>

<div id="menu">
<button onclick="map.setView([20,0],2)">🌍 Mundo</button>
<button onclick="map.setView([50,10],4)">🇪🇺 UE</button>
<button onclick="map.setView([40,-3],6)">🇪🇸 España</button>
<button onclick="map.fitBounds(L.geoJSON(cyl).getBounds())">
  Castilla y León
</button>
<button onclick="map.fitBounds(burgosZona.getBounds())">Burgos</button>
``

</div>

<div id="panel">
<h3 id="titulo">Selecciona un lugar</h3>
<textarea>Escribe aquí tu información...</textarea>
</div>

<div id="map"></div>

<script>
var map = L.map('map').setView([20,0],2);


L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);


fetch('https://raw.githubusercontent.com/codeforgermany/click_that_hood/main/public/data/spain-provinces.geojson')
  .then(res => res.json())
  .then(data => {
    // Filtrar solo Burgos
    var burgos = data.features.filter(f => f.properties.name === "Burgos");

    var cyl = data.features.filter(f => 
  f.properties.name === "Castilla and León"
);

fetch('https://raw.githubusercontent.com/codeforgermany/click_that_hood/main/public/data/spain-regions.geojson')
  .then(res => res.json())
  .then(data => {

    var cyl = data.features.filter(f => f.properties.name === "Castilla y León");

    L.geoJSON(cyl, {
      style: {
        color: 'green',
        weight: 3,
        fillColor: '#00ff00',
        fillOpacity: 0.15
      }
    }).addTo(map);

  });

    L.geoJSON(burgos, {
      style: {
        color: 'red',
        weight: 3,
        fillColor: '#ff0000',
        fillOpacity: 0.2
      }
    }).addTo(map);

    // Centrar mapa en Burgos
    map.fitBounds(L.geoJSON(burgos).getBounds());
  });

// Pueblos
crear("Cogollos",42.286,-3.581,"cogollos.jpg");
crear("Isar",42.366,-3.925);
crear("Cardeñadijo",42.302,-3.639,"cardenadijo.jpg");
crear("Las Quintanillas",42.372,-3.823,"lasquintanillas.jpg");
crear("Orbaneja Riopico",42.401,-3.583,"orbaneja.jpg");
crear("Rubena",42.390,-3.570,"rubena.jpg");
crear("Saldaña de Burgos",42.260,-3.699,"saldana.jpg");
crear("Arcos",42.250,-3.760,"arcos.jpg");
crear("Buniel",42.310,-3.835);
crear("Albillos",42.285,-3.790);
crear("Palacios de Benaver",42.392,-3.895,"palaciosbenaver.jpg");
crear("Villanueva de las Carretas",42.329,-3.799);
crear("Castilla y León", 41.639,-4.430);


L.geoJSON(burgosGeo, {
  style: {
    color: 'blue',
    weight: 2,
    fillColor: '#3388ff',
    fillOpacity: 0.2
  }
}).addTo(map);

map.fitBounds(L.geoJSON(burgosGeo).getBounds());
``

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);


function crear(nombre, lat, lon, imagen = null) {
  let imgFinal = imagen ? imagen : "blanco.jpg";

  let contenido = `<b>${nombre}</b><br>`;
  contenido += `<img src="./${imgFinal}" width="200">`;

  L.marker([lat, lon]).addTo(map).bindPopup(contenido);
}

// Lugares
crear("Burgos",42.34,-3.69);
crear("Castilla y León",42,-4);
crear("España",40,-3);
crear("UE",50,10);

fetch('https://raw.githubusercontent.com/codeforgermany/click_that_hood/main/public/data/spain-regions.geojson')
.then(r=>r.json())
.then(d=>{
  const f = d.features.find(x=>x.properties.name==="Castilla y León");
  L.geoJSON(f,{style:{color:'green',weight:4,fillOpacity:0}}).addTo(map);
});
</script>

</body>
</html>
