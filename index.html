<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Mapa interactivo Burgos PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:Arial; }

#map {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
}

#menu {
  position:absolute;
  top:10px;
  left:10px;
  z-index:1000;
}

#menu button {
  display:block;
  margin-bottom:5px;
  padding:8px;
  background:#0078D7;
  color:white;
  border:none;
}

#panel {
  position:absolute;
  top:10px;
  right:10px;
  width:250px;
  background:white;
  padding:10px;
  border-radius:10px;
  z-index:1000;
}

textarea { width:100%; height:100px; }
</style>
</head>

<body>

<div id="menu">
<button onclick="map.setView([20,0],2)">🌍 Mundo</button>
<button onclick="map.setView([50,10],4)">🇪🇺 UE</button>
<button onclick="map.setView([40,-3],6)">🇪🇸 España</button>
<button onclick="map.setView([42,-4],7)">Castilla y León</button>
<button onclick="map.setView([42.34,-3.69],10)">Burgos</button>
</div>

<div id="panel">
<h3>Selecciona un lugar</h3>
<textarea></textarea>
</div>

<div id="map"></div>

<script>

// ===== MAPA =====
var map = L.map('map').setView([40,-3],6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

// ===== FUNCION PUEBLOS =====

  contenido += `<img src="https://raw.githubusercontent.com/pisuergaodra-design/Mis-pueblos-en-el-Mundo_Mapa-interactivo-/main/${imgFinalido);
}

// ===== TUS PUEBLOS =====
crear("Cogollos",42.286,-3.581,"cogollos.jpg");
crear("Isar",42.366,-3.925);
crear("Cardeñadijo",42.302,-3.639,"cardeñadijo.jpg");
crear("Las Quintanillas",42.372,-3.823,"lasquintanillas.jpg");
crear("Orbaneja Riopico",42.401,-3.583,"orbaneja.jpg");
