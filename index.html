<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Mis pueblos en el mundo</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
https://unpkg.com/leaflet@1.9.4/dist/leaflet.js</script>

<style>
#map {
    height: 100vh;
    width: 100%;
}
</style>
</head>

<body>

<div id="map"></div>

<script>

// Crear el mapa
var map = L.map('map').setView([42.34, -3.70], 6);

// Capa base
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

// ✅ TUS PUEBLOS (puedes ampliar esto)
var pueblos = [
    {
        nombre: "Villaquirán de los Infantes",
        coords: [42.45, -4.10],
        info: "Tu pueblo base"
    },
    {
        nombre: "Burgos",
        coords: [42.34, -3.70],
        info: "Ciudad de referencia"
    }
];

// Añadir marcadores
pueblos.forEach(function(pueblo) {
    L.marker(pueblo.coords)
        .addTo(map)
        .bindPopup("<b>" + pueblo.nombre + "</b><br>" + pueblo.info);
});

// ✅ Añadir puntos al hacer clic (para reconstruir rápido)
map.on('click', function(e) {
    L.marker([e.latlng.lat, e.latlng.lng])
        .addTo(map)
        .bindPopup("Nuevo pueblo:<br>" + e.latlng.lat + ", " + e.latlng.lng)
        .openPopup();
});

</script>

</body>
</html>
