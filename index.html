<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Mapa interactivo Burgos PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:Arial; }

#map {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:1;
}

#panel {
  position:absolute;
  top:10px;
  right:10px;
  width:250px;
  background:white;
  padding:10px;
  border-radius:10px;
  z-index:1000;
}

#menu {
  position:absolute;
  top:10px;
  left:10px;
  z-index:1000;
}

#menu button {
  display:block;
  margin-bottom:5px;
  padding:8px;
  background:#0078D7;
  color:white;
  border:none;
  cursor:pointer;
}

textarea { width:100%; height:100px; }
</style>
</head>

<body>

<div id="menu">
<button onclick="map.setView([20,0],2)">🌍 Mundo</button>
<button onclick="map.setView([50,10],4)">🇪🇺 UE</button>
<button onclick="map.setView([40,-3],6)">🇪🇸 España</button>
<button onclick="mostrarCastillaYLeon()">Castilla y León</button>
<button onclick="mostrarBurgos()">Burgos</button>
</div>

<div id="panel">
<h3 id="titulo">Selecciona un lugar</h3>
<textarea>Escribe aquí tu información...</textarea>
</div>

<div id="map"></div>

<script>
var map = L.map('map').setView([42.34,-3.69],8);
var cylLayer = null;
var burgosLayer = null;

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

// Función para crear marcadores
function crear(nombre, lat, lon, imagen = null) {
  let imgFinal = imagen ? imagen : "blanco.jpg";
  let contenido = `<b>${nombre}</b><br>`;
  contenido += `<img src="./${imgFinal}" width="200">`;
  L.marker([lat, lon]).addTo(map).bindPopup(contenido);
}

// Función para mostrar Castilla y León
function mostrarCastillaYLeon() {
  if(cylLayer) {
    map.fitBounds(cylLayer.getBounds());
  }
}

// Función para mostrar Burgos
function mostrarBurgos() {
  if(burgosLayer) {
    map.fitBounds(burgosLayer.getBounds());
  }
}

// Cargar datos de regiones y provincias con contornos exactos
Promise.all([
  // Datos de regiones españolas con contornos exactos
  fetch('https://raw.githubusercontent.com/codeforspain/datos/master/geo/regionesCCAA.geojson').then(res => res.json()).catch(() => null),
  // Alternativa: datos de provincias españolas
  fetch('https://raw.githubusercontent.com/codeforspain/datos/master/geo/provincias.geojson').then(res => res.json()).catch(() => null)
]).then(([regionesData, provinciasData]) => {
  
  let cylEncontrada = false;
  let burgosEncontrada = false;
  
  // Intentar cargar Castilla y León desde regiones
  if(regionesData && regionesData.features) {
    var cylData = regionesData.features.filter(f => 
      (f.properties.name && f.properties.name.includes("Castilla")) ||
      (f.properties.CCAA && f.properties.CCAA.includes("Castilla"))
    );
    
    if(cylData.length > 0) {
      cylLayer = L.geoJSON(cylData, {
        style: {
          color: 'green',
          weight: 2,
          fillColor: '#90EE90',
          fillOpacity: 0.4,
          dashArray: '5, 5'
        }
      }).addTo(map);
      cylEncontrada = true;
    }
  }
  
  // Intentar cargar Burgos desde provincias
  if(provinciasData && provinciasData.features) {
    var burgosData = provinciasData.features.filter(f => 
      (f.properties.name && f.properties.name === "Burgos") ||
      (f.properties.NAMEUNIT && f.properties.NAMEUNIT === "Burgos") ||
      (f.properties.provincia && f.properties.provincia.includes("Burgos"))
    );
    
    if(burgosData.length > 0) {
      burgosLayer = L.geoJSON(burgosData, {
        style: {
          color: 'red',
          weight: 3,
          fillColor: '#FFB6C6',
          fillOpacity: 0.35
        }
      }).addTo(map);
      map.fitBounds(burgosLayer.getBounds());
      burgosEncontrada = true;
    }
  }
  
  // Si no se encuentran, intentar con otra fuente
  if(!cylEncontrada || !burgosEncontrada) {
    return fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_1_states_provinces.geojson')
      .then(res => res.json())
      .then(data => {
        // Buscar Castilla y León
        var cylData = data.features.filter(f => 
          f.properties.name && f.properties.name.includes("Castilla")
        );
        if(cylData.length > 0 && !cylEncontrada) {
          cylLayer = L.geoJSON(cylData, {
            style: {
              color: 'green',
              weight: 2,
              fillColor: '#90EE90',
              fillOpacity: 0.4,
              dashArray: '5, 5'
            }
          }).addTo(map);
        }
        
        // Buscar Burgos
        var burgosData = data.features.filter(f => 
          f.properties.name && f.properties.name === "Burgos"
        );
        if(burgosData.length > 0 && !burgosEncontrada) {
          burgosLayer = L.geoJSON(burgosData, {
            style: {
              color: 'red',
              weight: 3,
              fillColor: '#FFB6C6',
              fillOpacity: 0.35
            }
          }).addTo(map);
          map.fitBounds(burgosLayer.getBounds());
        }
      });
  }
  
}).then(() => {
  // PUEBLOS - Se crean DESPUÉS de cargar los datos de regiones
  crear("Cogollos",42.286,-3.581,"cogollos.jpg");
  crear("Isar",42.366,-3.925);
  crear("Cardeñadijo",42.302,-3.639,"cardeñadijo.jpg");
  crear("Las Quintanillas",42.372,-3.823,"lasquintanillas.jpg");
  crear("Orbaneja Riopico",42.401,-3.583,"orbaneja.jpg");
  crear("Rubena",42.390,-3.570,"rubena.jpg");
  crear("Saldaña de Burgos",42.260,-3.699,"saldana.jpg");
  crear("Arcos",42.250,-3.760,"arcos.jpg");
  crear("Buniel",42.310,-3.835);
  crear("Albillos",42.285,-3.790);
  crear("Palacios de Benaver",42.392,-3.895,"palaciosbenaver.jpg");
  crear("Villanueva de las Carretas",42.329,-3.799);
}).catch(err => {
  console.error('Error cargando datos GeoJSON:', err);
  console.log('Usando contornos alternativos...');
  
  // Polígono alternativo de Castilla y León (simplificado)
  var cylAlternativo = {
    type: "FeatureCollection",
    features: [{
      type: "Feature",
      properties: {name: "Castilla y León"},
      geometry: {
        type: "Polygon",
        coordinates: [[
          [-6.5, 37.5], [-6.5, 43], [-0.5, 43], [-0.5, 37.5], [-6.5, 37.5]
        ]]
      }
    }]
  };
  
  // Polígono alternativo de Burgos (simplificado)
  var burgosAlternativo = {
    type: "FeatureCollection",
    features: [{
      type: "Feature",
      properties: {name: "Burgos"},
      geometry: {
        type: "Polygon",
        coordinates: [[
          [-4.3, 41.8], [-4.3, 42.7], [-2.8, 42.7], [-2.8, 41.8], [-4.3, 41.8]
        ]]
      }
    }]
  };
  
  // Dibujar Castilla y León alternativo
  cylLayer = L.geoJSON(cylAlternativo, {
    style: {
      color: 'green',
      weight: 2,
      fillColor: '#90EE90',
      fillOpacity: 0.4,
      dashArray: '5, 5'
    }
  }).addTo(map);
  
  // Dibujar Burgos alternativo
  burgosLayer = L.geoJSON(burgosAlternativo, {
    style: {
      color: 'red',
      weight: 3,
      fillColor: '#FFB6C6',
      fillOpacity: 0.35
    }
  }).addTo(map);
  
  // Crear pueblos en fallback
  crear("Cogollos",42.286,-3.581,"cogollos.jpg");
  crear("Isar",42.366,-3.925);
  crear("Cardeñadijo",42.302,-3.639,"cardeñadijo.jpg");
  crear("Las Quintanillas",42.372,-3.823,"lasquintanillas.jpg");
  crear("Orbaneja Riopico",42.401,-3.583,"orbaneja.jpg");
  crear("Rubena",42.390,-3.570,"rubena.jpg");
  crear("Saldaña de Burgos",42.260,-3.699,"saldana.jpg");
  crear("Arcos",42.250,-3.760,"arcos.jpg");
  crear("Buniel",42.310,-3.835);
  crear("Albillos",42.285,-3.790);
  crear("Palacios de Benaver",42.392,-3.895,"palaciosbenaver.jpg");
  crear("Villanueva de las Carretas",42.329,-3.799);
});

</script>

</body>
</html>
