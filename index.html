<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Mapa interactivo Burgos PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:Arial; }

#map {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:1;
}

#panel {
  position:absolute;
  top:10px;
  right:10px;
  width:250px;
  background:white;
  padding:10px;
  border-radius:10px;
  z-index:1000;
}

#menu {
  position:absolute;
  top:10px;
  left:10px;
  z-index:1000;
}

#menu button {
  display:block;
  margin-bottom:5px;
  padding:8px;
  background:#0078D7;
  color:white;
  border:none;
  cursor:pointer;
}

textarea { width:100%; height:100px; }
</style>
</head>

<body>

<div id="menu">
<button onclick="map.setView([20,0],2)">🌍 Mundo</button>
<button onclick="map.setView([50,10],4)">🇪🇺 UE</button>
<button onclick="map.setView([40,-3],6)">🇪🇸 España</button>
<button onclick="mostrarCastillaYLeon()">Castilla y León</button>
<button onclick="mostrarBurgos()">Burgos</button>
</div>

<div id="panel">
<h3 id="titulo">Selecciona un lugar</h3>
<textarea>Escribe aquí tu información...</textarea>
</div>

<div id="map"></div>

<script>
var map = L.map('map').setView([42.34,-3.69],8);
var cylLayer = null;
var burgosLayer = null;

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

// Función para crear marcadores
function crear(nombre, lat, lon, imagen = null) {
  let imgFinal = imagen ? imagen : "blanco.jpg";
  let contenido = `<b>${nombre}</b><br>`;
  contenido += `<img src="./${imgFinal}" width="200">`;
  L.marker([lat, lon]).addTo(map).bindPopup(contenido);
}

// Función para mostrar Castilla y León
function mostrarCastillaYLeon() {
  if(cylLayer) {
    map.fitBounds(cylLayer.getBounds());
  }
}

// Función para mostrar Burgos
function mostrarBurgos() {
  if(burgosLayer) {
    map.fitBounds(burgosLayer.getBounds());

}

  style: {
    color: 'red',
    weight: 3,
    fillColor: '#FFB6C6',
    fillOpacity: 0.35

// Dibujar Castilla y León
