<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mapa interactivo</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:Arial; }

#map {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
}

#menu {
  position:absolute;
  top:10px;
  left:10px;
  z-index:1000;
}

#menu button {
  display:block;
  margin-bottom:5px;
  padding:8px;
  background:#0078D7;
  color:white;
  border:none;
}

#panel {
  position:absolute;
  top:10px;
  right:10px;
  width:250px;
  background:white;
  padding:10px;
  border-radius:10px;
  z-index:1000;
}

textarea { width:100%; height:100px; }
</style>

</head>
<body>

<div id="menu">
<button onclick="map.setView([20,0],2)">Mundo</button>
<button onclick="map.setView([50,10],4)">UE</button>
<button onclick="map.setView([40,-3],6)">España</button>
<button onclick="map.setView([42,-4],7)">Castilla y León</button>
<button onclick="map.setView([42.34,-3.69],10)">Burgos</button>
</div>

<div id="panel">
<h3>Selecciona un lugar</h3>
<textarea></textarea>
</div>

<div id="map"></div>

<script>

var map = L.map('map').setView([40,-3],6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

function crear(nombre, lat, lon, imagen = null) {
  let img = imagen ? imagen : "blanco.jpg";
  let html = "<b>"+nombre+"</b><br>";
  html += '<img src="https://raw.githubusercontent.com/pisuergaodra-design/Mis-pueblos-en-el-Mundo_Mapa-interactivo-/main/'+img+'" width="20086,-3.581,"cogollos.jpg");
crear("Isar",42.366,-3.925);
crear("Cardeñadijo",42.302,-3.639,"cardeñadijo.jpg");
crear("Las Quintanillas",42.372,-3.823,"lasquintanillas.jpg");
crear("Orbaneja Riopico",42.401,-3.583,"orbaneja.jpg");
crear("Rubena",42.390,-3.570,"rubena.jpg");
crear("Saldaña de Burgos",42.260,-3.699,"saldana.jpg");
crear("Arcos",42.250,-3.760,"arcos.jpg");
crear("Buniel",42.310,-3.835);
crear("Albillos",42.285,-3.790);
crear("Palacios de Benaver",42.3925,-3.8953,"palaciosbenaver.jpg");
crear("Palacios de Benaver",42.392,-3.895,"palaciosbenaver.jpg");
crear("Villanueva de las Carretas",42.329,-3.799);

fetch('https://raw.githubusercontent.com/codeforgermany/click_that_hood/main/public/data/spain-provinces.geojson')
.then(r => r.json())
.then(data => {

  const cyl = [
    "Ávila","Burgos","León","Palencia",
    "Salamanca","Segovia","Soria",
    "Valladolid","Zamora"
  ];

  L.geoJSON(data, {
    style: function(f) {

      if (f.properties.name === "Burgos") {
        return { color:'red', weight:4, fillColor:'red', fillOpacity:0.4 };
      }

      if (cyl.includes(f.properties.name)) {
        return { color:'green', weight:2, fillColor:'green', fillOpacity:0.25 };
      }

      return { color:'#888', weight:1, fillOpacity:0.05 };
    }
  }).addTo(map);

});

</script>

</body>
</html>
``
